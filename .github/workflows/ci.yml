name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-typecheck-unit-build:
    name: Lint, Typecheck, Unit Tests & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit Tests
        run: npm run test:unit
      - name: Build Next.js
        run: npm run build

  security-rls:
    name: Security & RLS Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - uses: supabase/setup-cli@v1
      - name: Start local Supabase
        run: supabase start
      - name: Apply Migrations
        run: supabase db push
      - name: Seed test data
        run: supabase db reset # if seed exists, otherwise use a custom script
      - name: Run Security Tests
        env:
          ALLOW_DESTRUCTIVE_TESTS: true
          # La base local arranca en puerto 54321
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          # TODO: Obtener el service role key real usando supabase start/status
          SUPABASE_SERVICE_ROLE_KEY: \${{ secrets.SUPABASE_LOCAL_ROLE_KEY_PLACEHOLDER }}
        run: npm run test:security
      - name: Stop Supabase
        if: always()
        run: supabase stop

  e2e:
    name: E2E Playwright Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Run E2E
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
