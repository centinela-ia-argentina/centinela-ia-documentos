name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  lint-typecheck-unit-build:
    name: Lint, Typecheck, Unit Tests & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Audit dependencies
        run: npm audit --omit=dev
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit Tests
        run: npm run test:unit
      - name: Build Next.js
        run: npm run build

  security-rls:
    name: Security & RLS Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - uses: supabase/setup-cli@v1
      - name: Setup Supabase and Seed
        run: bash scripts/ci-setup.sh
      - name: Run Security Tests
        env:
          ALLOW_DESTRUCTIVE_TESTS: true
        run: npm run test:security
      - name: Run Drift Tests
        env:
          ALLOW_DESTRUCTIVE_TESTS: true
        run: npm run test:drift
      - name: Stop Supabase
        if: always()
        run: supabase stop

  e2e:
    name: E2E Playwright Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - uses: supabase/setup-cli@v1
      - name: Setup Supabase and Seed
        run: bash scripts/ci-setup.sh
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Start Next.js and Run E2E
        env:
          TEST_USER_EMAIL: admin.legal@test.com
          TEST_USER_PASSWORD: password123
          MOCK_AI: 'true'
          GEMINI_API_KEY: 'ci-mock-key'
          NODE_OPTIONS: '--require ./mock-ai.js'
          E2E_TEST_MODE: 'true'
        run: |
          npm run build
          npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
      - name: Stop Supabase
        if: always()
        run: supabase stop

  migration-tests:
    name: Migration & Rollback Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - uses: supabase/setup-cli@v1
      - name: Run Migration and Rollback Script
        run: bash scripts/test-migrations.sh
      - name: Upload Migration Snapshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: migration-rollback-report
          path: |
            initial_*.sql
            initial_*.txt
            final_*.sql
            final_*.txt
            *_diff.txt
          retention-days: 30
      - name: Stop Supabase
        if: always()
        run: supabase stop
