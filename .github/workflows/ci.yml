name: CI Pipeline

on:
  push:
    branches:
      - fix/juridico-commercial-ready-02
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  lint-typecheck-unit-build:
    name: Lint, Typecheck, Unit Tests & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Audit dependencies
        run: npm audit --omit=dev
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit Tests
        run: npm run test:unit
      - name: Build Next.js
        run: npm run build

  security-rls:
    name: Security & RLS Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - uses: supabase/setup-cli@v1
      - name: Start local Supabase
        run: supabase start
      - name: Apply Migrations
        run: supabase db reset --local
      - name: Extract Supabase Keys and Map Env Vars
        run: |
          supabase status -o env > /tmp/supabase.env
          set -a
          source /tmp/supabase.env
          set +a

          : "${API_URL:?Missing API_URL}"
          : "${ANON_KEY:?Missing ANON_KEY}"
          : "${SERVICE_ROLE_KEY:?Missing SERVICE_ROLE_KEY}"

          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"
      - name: Run Seed Script
        run: npx tsx tests/setup/seed-supabase.ts
      - name: Run Security Tests
        env:
          ALLOW_DESTRUCTIVE_TESTS: true
        run: npm run test:security
      - name: Stop Supabase
        if: always()
        run: supabase stop

  e2e:
    name: E2E Playwright Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - uses: supabase/setup-cli@v1
      - name: Start local Supabase
        run: supabase start
      - name: Apply Migrations
        run: supabase db reset --local
      - name: Extract Supabase Keys and Map Env Vars
        run: |
          supabase status -o env > /tmp/supabase.env
          set -a
          source /tmp/supabase.env
          set +a

          : "${API_URL:?Missing API_URL}"
          : "${ANON_KEY:?Missing ANON_KEY}"
          : "${SERVICE_ROLE_KEY:?Missing SERVICE_ROLE_KEY}"

          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Start Next.js and Run E2E
        env:
          TEST_USER_EMAIL: admin.legal@test.com
          TEST_USER_PASSWORD: password123
          MOCK_AI: 'true'
          NODE_OPTIONS: '--require ./mock-ai.js'
        run: |
          npm run build
          npm run start &
          npx wait-on http://127.0.0.1:3000
          npx tsx tests/setup/seed-supabase.ts
          npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
